name: Backend CI/CD
on:
  push:
    branches:
      - full-stack
      - '**'
#    paths:
#      - 'backend/**'

env:
  DOCKERHUB_REPO: ${{ secrets.DOCKERHUB_USERNAME }}/starttech-backend
  AWS_REGION: 'eu-west-2'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/
    steps:
      # Checkout the repo
      - name: Checkout Repo
        uses: actions/checkout@v4

      # Install Go
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      # Restore Go modules from cache if available
      - name: Download Cached Dependencies
        uses: actions/cache@v4
        id: cache
        with:
          path: |
            ~/.cache/go-build                                                                                                                                                                 
            ~/go/pkg/mod
          key: deps-go-mod-${{ hashFiles('backend/go.sum') }}

      # Install Go modules if cache didn't hit
      - name: Download Dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: go mod download

      # Run unit tests with race detection and coverage
      - name: Run Unit Tests
        run: go test -v -coverprofile=coverage.out ./...
        continue-on-error: true

      # Run integration tests
      - name: Run Integration Tests
        run: go test -v -tags=integration ./...
        continue-on-error: true

      # Code quality check
      - name: Code Quality Check (golangci-lint)
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: backend/
        continue-on-error: true

      # Scan for known vulnerabilities in dependencies
      - name: Vulnerability Scan (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest                                                                                                                           
          govulncheck ./...
        continue-on-error: true

  build:
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    defaults:
      run:
        working-directory: backend/
    steps:
      # Checkout the repo
      - name: Checkout Repo
        uses: actions/checkout@v4

      # Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Generate image tags (commit SHA + latest)
      - name: Generate Image Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_REPO }}
          tags: |
            type=sha,prefix=                                                                                                                                                            
            type=raw,value=latest                                                                                                                                                  

      # Build and push Docker image with layer caching
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: backend/
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Scan Docker image for security vulnerabilities
      - name: Scan Docker Image for Vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.DOCKERHUB_REPO }}:latest
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    steps:
      # Checkout the repo
      - name: Checkout Repo
        uses: actions/checkout@v4

      # Configure AWS credentials using OIDC
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

#          role-to-assume: ${{ secrets.AWS_ROLE_ARN_BACKEND }

      # Verify image was pushed successfully
      - name: Verify Image
        run: |
          sleep 10
          docker pull ${{ env.DOCKERHUB_REPO }}:latest
          docker inspect ${{ env.DOCKERHUB_REPO }}:latest --format='Architecture: {{.Architecture}}'
          echo "Image verified successfully!"                                                                                                                                                    

      # Trigger rolling update via ASG instance refresh
      - name: Trigger Rolling Update (ASG Instance Refresh)
        run: |
          aws autoscaling start-instance-refresh \                                                                                                                                      
            --auto-scaling-group-name ${{ secrets.ASG_NAME }} \                                                                                                                         
            --preferences '{"MinHealthyPercentage": 50, "InstanceWarmup": 120}'                                                                                                         
          
          echo "Instance refresh started. New instances will pull the latest image."                                                                                                    

      # Wait for deployment to complete
      - name: Wait for Deployment to Complete
        run: |
          echo "Waiting for instance refresh to complete..."                                                                                                                            
          
          while true; do                                                                                                                                                                
            STATUS=$(aws autoscaling describe-instance-refreshes \                                                                                                                      
              --auto-scaling-group-name ${{ secrets.ASG_NAME }} \                                                                                                                       
              --query 'InstanceRefreshes[0].Status' \                                                                                                                                   
              --output text)                                                                                                                                                            
          
            echo "Current status: $STATUS"                                                                                                                                              
          
            if [ "$STATUS" = "Successful" ]; then                                                                                                                                       
              echo "Deployment completed successfully!"                                                                                                                                 
              break                                                                                                                                                                     
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ]; then                                                                                                          
              echo "Deployment failed with status: $STATUS"                                                                                                                             
              exit 1                                                                                                                                                                    
            fi                                                                                                                                                                          
          
            sleep 30                                                                                                                                                                    
          done                                                                                                                                                                          

      # Deployment notification
      - name: Deployment Notification
        run: echo "Backend deployed successfully!"